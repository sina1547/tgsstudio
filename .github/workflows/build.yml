name: Build

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      # app/build.gradle.kts is the single source of truth for app versioning.
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building TGS Studio v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace :document:test :parser:test :renderer:test :editor:test :export:test :app:assembleDebug

      - name: rlottie conformance check (keyframes, trim paths, shapes)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2
          python3 -m pip install -q rlottie-python numpy pillow cairosvg
          python3 tools/rlottie_check.py export/build/rlottie-fixtures

      - name: Rename debug APK
        env:
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
        run: |
          mkdir -p app/build/outputs/apk/named
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/named/TGSStudio_v${VERSION_NAME}_debug.apk"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            document/build/reports/tests
            parser/build/reports/tests
            renderer/build/reports/tests
            editor/build/reports/tests
            export/build/reports/tests
          if-no-files-found: warn

      - name: Upload debug APK for CI testing
        uses: actions/upload-artifact@v6
        with:
          name: TGSStudio-v${{ steps.app_version.outputs.version_name }}-debug
          path: app/build/outputs/apk/named/TGSStudio_v${{ steps.app_version.outputs.version_name }}_debug.apk

      # A push to main must never publish an APK signed with an ephemeral debug key.
      - name: Validate release signing secrets and keystore
        id: signing
        if: github.event_name == 'push'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          [ -n "$SIGNING_KEYSTORE_BASE64" ] || missing+=("SIGNING_KEYSTORE_BASE64")
          [ -n "$SIGNING_STORE_PASSWORD" ] || missing+=("SIGNING_STORE_PASSWORD")
          [ -n "$SIGNING_KEY_ALIAS" ] || missing+=("SIGNING_KEY_ALIAS")
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing+=("SIGNING_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            echo "Configure all four repository Actions secrets before publishing a release." >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/tgsstudio-release.jks"
          if ! printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "SIGNING_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [ ! -s "$KEYSTORE" ]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Release keystore, store password, or key alias is invalid." >&2
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          echo "store_file=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "Release signing credentials and key alias validated."

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and rename signed release APK
        if: github.event_name == 'push'
        env:
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
        shell: bash
        run: |
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          cp "$RELEASE_APK" "app/build/outputs/apk/named/TGSStudio_v${VERSION_NAME}.apk"

      - name: Upload signed release APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: TGSStudio-v${{ steps.app_version.outputs.version_name }}-signed
          path: app/build/outputs/apk/named/TGSStudio_v${{ steps.app_version.outputs.version_name }}.apk

      - name: Publish signed release APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: TGS Studio build ${{ github.run_number }} (v${{ steps.app_version.outputs.version_name }})
          prerelease: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/named/TGSStudio_v${{ steps.app_version.outputs.version_name }}.apk

      - name: Upload rlottie fixtures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rlottie-fixtures
          path: export/build/rlottie-fixtures
          if-no-files-found: warn
