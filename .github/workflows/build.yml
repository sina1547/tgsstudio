name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace :document:test :parser:test :renderer:test :editor:test :export:test :app:assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            document/build/reports/tests
            parser/build/reports/tests
            renderer/build/reports/tests
            editor/build/reports/tests
            export/build/reports/tests
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgs-studio-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TGS Studio build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
